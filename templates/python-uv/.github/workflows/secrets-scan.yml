name: Secrets Scan

# Checks the commits each pull request and each push to main brings in:
# secrets (kilotronic/checks/secret-scan: gitleaks, plus trufflehog for keys that
# still work) and real commit authors (kilotronic/checks/git-identity).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    # trufflehog runs in Docker, so this stays on a GitHub-hosted Linux runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Secret scan
        uses: kilotronic/checks/secret-scan@a6e8917fddb679077a2e8a427598ff1fd7a160ef # v1.0.0

      - name: Commit authors
        uses: kilotronic/checks/git-identity@a6e8917fddb679077a2e8a427598ff1fd7a160ef # v1.0.0
