name: Secrets Scan

# Checks the commits each pull request and each push to main brings in:
# secrets (kilotronic/checks/secret-scan: gitleaks, plus trufflehog for keys that
# still work) and real commit authors (kilotronic/checks/git-identity).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    # trufflehog runs in Docker, so this stays on a GitHub-hosted Linux runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Secret scan
        uses: kilotronic/checks/secret-scan@1bc3a9cd7c8875e77799faae6774f6f8eec50207 # v1.0.1

      - name: Commit authors
        uses: kilotronic/checks/git-identity@1bc3a9cd7c8875e77799faae6774f6f8eec50207 # v1.0.1
