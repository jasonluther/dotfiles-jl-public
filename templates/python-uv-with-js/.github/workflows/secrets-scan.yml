name: Secrets Scan

# Checks the commits each pull request and each push to main brings in:
# secrets (kilotronic/secret-scan: gitleaks, plus trufflehog for keys that
# still work) and real commit authors (kilotronic/git-identity).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    # trufflehog runs in Docker, so this stays on a GitHub-hosted Linux runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Secret scan
        uses: kilotronic/secret-scan@006556b813fd5054d7da8575d3928c5ad3583535 # v1.1.0

      - name: Commit authors
        uses: kilotronic/git-identity@76223f8d531904185d4bd46f66c65849cf0133f7 # v2.2.0
