# idle-suspend configuration — installed to /etc/idle-suspend.conf.
# Sourced by the idle-suspend script and wol-enable.service.

# Wired NIC to arm for Wake-on-LAN (required by wol-enable.service).
WOL_NIC=CHANGE_ME

# Established TCP connections to this port count as busy.
SSH_PORT=22

# Space-separated process names; any running match counts as busy. Matched
# with `pgrep -x` against the kernel comm, so names must be exact and are
# capped at 15 chars (longer names never match). Tailscale SSH sessions are
# always counted separately (as tailscaled children — they never open kernel
# TCP sockets on SSH_PORT). Add mosh-server here only if you accept that
# lingering mosh sessions block suspend indefinitely.
BUSY_PROCS="claude"

# 15-minute load average at or above this blocks suspend.
LOAD_THRESHOLD=0.8

# Consecutive idle checks (one per timer tick, 5 min) before suspending.
# 6 x 5min = 30 minutes idle.
IDLE_CHECKS_REQUIRED=6
