name: Scaffold templates and run pre-commit

on:
  push:
    branches: [main]
    paths:
      - copier.yml
      - templates/**
      - .github/workflows/scaffold-precommit.yml
  pull_request:
    paths:
      - copier.yml
      - templates/**
      - .github/workflows/scaffold-precommit.yml

# Self-hosted toggle: set vars.RUNS_ON to 'self-hosted' to route to local runners.
#   gh variable set RUNS_ON --body 'self-hosted' -R jasonluther/dotfiles-jl-public
#   gh variable set RUNS_ON --body 'ubuntu-latest' -R jasonluther/dotfiles-jl-public  # revert

jobs:
  smoke:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [python-uv, python-uv-with-js]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # uv provisions its own interpreter for `uv tool install` / `uv sync`,
          # avoiding actions/setup-python — which lacks prebuilt 3.13 binaries
          # for Debian 13 on self-hosted runners.
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      # Cache pre-commit hook envs (typically ~2-3 min of the run is the
      # ruff/markdownlint/trufflehog/etc. environment install). Key on the
      # actual hook config so a template bump invalidates the cache.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ matrix.flavor }}-${{ hashFiles(format('templates/{0}/.pre-commit-config.yaml.jinja', matrix.flavor)) }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ matrix.flavor }}-

      - name: Install copier
        run: uv tool install copier

      - name: Install Vale (binary release — user-local, no sudo)
        run: |
          VALE_VERSION=3.9.1
          install -d "$HOME/.local/bin"
          curl -sSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vale" --version

      - name: Configure git identity (needed for scaffold commit)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Scaffold ${{ matrix.flavor }} into /tmp/scaffold
        run: |
          # Self-hosted runners persist /tmp between runs; a leftover scaffold
          # would make copier prompt to overwrite (interactive, fails in CI).
          rm -rf /tmp/scaffold
          copier copy "$GITHUB_WORKSPACE" /tmp/scaffold \
            --data flavor=${{ matrix.flavor }} \
            --data project_name=smoke-test \
            --data project_slug=smoke_test \
            --data description="CI smoke test scaffold" \
            --defaults

      - name: Bootstrap scaffolded project
        working-directory: /tmp/scaffold
        run: |
          git init -q -b main
          mkdir -p src/smoke_test tests
          touch src/smoke_test/__init__.py
          printf 'def test_placeholder():\n    assert True\n' > tests/test_placeholder.py
          uv sync --group dev
          if [ "${{ matrix.flavor }}" = "python-uv-with-js" ]; then
            npm install
          fi
          uv run pre-commit install

      - name: Run pre-commit (twice — first to auto-fix, second to verify clean)
        working-directory: /tmp/scaffold
        run: |
          git add -A
          uv run pre-commit run --all-files || true   # first run may auto-fix
          git add -A
          uv run pre-commit run --all-files            # must pass clean
