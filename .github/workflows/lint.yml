name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Runner: vars.RUNS_ON (a self-hosted runner label) applies only while the
# repo is private. A public repo always runs on GitHub-hosted ubuntu-latest,
# which is free for public repos and keeps outside pull requests off the
# owner's machines. This repo is public, so RUNS_ON is ignored here.

jobs:
  lint:
    runs-on: ${{ (github.event.repository.private && vars.RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Cache pre-commit envs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: |
          uv tool install pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure zsh is available
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends zsh
          fi

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: pre-commit
        env:
          SKIP: trailing-whitespace,end-of-file-fixer,check-yaml,check-json,check-toml,check-merge-conflict,detect-private-key,secret-scan,git-identity,data-leak-check,shellcheck,actionlint,pinned
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: ruff (shebang Python scripts only)
        run: |
          # shellcheck disable=SC2016
          mapfile -t files < <(
            find . -type f \
              \( -path '*/bin/executable_*' -o -path '*/hooks/executable_*' \) \
              -not -name '*.py' \
              -not -path './.git/*' \
              -not -path './.ruff_cache/*' \
              -print0 | xargs -0 -I{} sh -c 'head -1 "$1" | grep -qE "python" && echo "$1"' _ {}
          )
          [ ${#files[@]} -eq 0 ] && { echo "no shebang python scripts"; exit 0; }
          printf '%s\n' "${files[@]}"
          uvx ruff check "${files[@]}"
          uvx ruff format --check "${files[@]}"

      - name: chezmoi template syntax
        env:
          CHEZMOI_NAME: ci
          CHEZMOI_EMAIL: ci@example.com
        # Isolated temp HOME — a bare `chezmoi init` would overwrite the
        # self-hosted runner operator's ~/.config/chezmoi/chezmoi.toml and
        # poison git identity on the next `chezmoi update --force`.
        run: bash "$GITHUB_WORKSPACE/scripts/ci/chezmoi-template-syntax.sh"

      - name: zsh -n (parser-only)
        run: |
          shopt -s nullglob
          files=(dot_zshrc dot_zprofile dot_config/shell/*.sh)
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            echo "==> $f"
            zsh -n "$f"
          done

      # Shared kilotronic tools. These check the commits this push or pull
      # request brings in, so the matching local hooks are skipped above.
      - name: Secret scan (kilotronic/secret-scan)
        uses: kilotronic/secret-scan@006556b813fd5054d7da8575d3928c5ad3583535 # v1.1.0

      - name: Shell, workflow and pin lint (kilotronic/lint)
        uses: kilotronic/lint@50d58c6fc3916432a60d6caf5914d5bb83a60a16 # v1.1.0
        with:
          # Same shellcheck exclusions as .pre-commit-config.yaml: zsh files,
          # chezmoi templates, and Python hooks deployed under .sh names.
          exclude: >-
            .chezmoiscripts/** dot_config/shell/** dot_zshrc dot_zprofile
            private_dot_claude/hooks/**

      - name: Commit authors (kilotronic/git-identity)
        uses: kilotronic/git-identity@76223f8d531904185d4bd46f66c65849cf0133f7 # v2.2.0

      - name: Private terms (kilotronic/data-leak-check)
        uses: kilotronic/data-leak-check@f1da8a7ce76bfaabd70ea815d9417fb691e95799 # v1.1.0
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}
          # Forks and Dependabot get no Actions secrets: let them through here;
          # the push to main checks the merged commits with the list.
          if-empty: ${{ (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') && 'skip' || 'fail' }}
