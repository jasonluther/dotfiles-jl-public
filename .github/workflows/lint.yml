name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Cancel a previous in-flight run on the same ref when a new one starts.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      # action-shellcheck auto-discovers shell scripts. We exclude:
      #  - .chezmoiscripts/         → bash + Jinja templating, won't parse as plain bash
      #  - dot_config/shell/, dot_zshrc, dot_zprofile → zsh, which shellcheck does not support
      #  - private_dot_claude/hooks/ → Python scripts that happen to use a `.sh` extension
      #                                (chezmoi deploys them as ~/.claude/hooks/*.sh).
      - uses: ludeeus/action-shellcheck@2.0.0
        env:
          # SC1091: skip "source file not found" — sources resolve at $HOME at runtime.
          SHELLCHECK_OPTS: -x -e SC1091
        with:
          ignore_paths: >-
            .chezmoiscripts
            dot_config/shell
            private_dot_claude/hooks
          ignore_names: >-
            dot_zshrc
            dot_zprofile

  shfmt:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: mfinelli/setup-shfmt@v4
      - name: shfmt --diff (bash files)
        run: |
          # shellcheck disable=SC2016
          # $1 in single-quoted sh -c body is intentional (inner shell expands it).
          mapfile -t files < <(
            find . -type f \( -name '*.sh' -o -path '*/bin/executable_*' -o -name 'install.sh' \) \
              -not -path './.git/*' \
              -not -path './.chezmoiscripts/*' \
              -not -path './dot_config/shell/*' \
              -not -name 'dot_zshrc' \
              -not -name 'dot_zprofile' \
              -print0 | xargs -0 -I{} sh -c 'head -1 "$1" | grep -qE "^#!.*(/env )?(bash|sh)$" && echo "$1"' _ {}
          )
          [ ${#files[@]} -eq 0 ] && { echo "no bash files to check"; exit 0; }
          printf '%s\n' "${files[@]}"
          shfmt -i 2 -ci -bn -d "${files[@]}"

  zsh-syntax:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get install -y --no-install-recommends zsh
      - name: zsh -n (parser-only check)
        run: |
          shopt -s nullglob
          files=(dot_zshrc dot_zprofile dot_config/shell/*.sh)
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            echo "==> $f"
            zsh -n "$f"
          done

  markdown:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      # Use markdownlint-cli (not -cli2) because cli2 only accepts configs
      # with specific filenames; ours is named `dot_markdownlintrc` so chezmoi
      # deploys it as `~/.markdownlintrc`.
      - run: npm install -g markdownlint-cli@0.48.0
      # Slash-command definitions under private_dot_claude/commands/ are
      # instruction text consumed by Claude Code, not rendered docs — they
      # use intentional formatting (literal spaces inside backticks for git
      # status flags, trailing ellipses in headings, etc.) that fights
      # markdownlint's defaults.
      - run: |
          markdownlint --config dot_markdownlintrc \
            --ignore 'templates/**' \
            --ignore '**/node_modules/**' \
            --ignore 'private_dot_claude/**' \
            '**/*.md'

  actionlint:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - run: ./actionlint -color

  secrets:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # trufflehog needs full history to scan past commits.
          fetch-depth: 0
      - name: Install trufflehog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
      - run: trufflehog git --no-update --results=verified,unverified --fail file://.

  ruff:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      # Some Python scripts have a `.sh` extension (chezmoi-deployed names like
      # ~/.claude/hooks/format-on-edit.sh) or no extension at all
      # (~/.local/bin/start-work-setup). Discover by `python` shebang.
      - name: ruff check + format (Python files, by shebang)
        run: |
          # shellcheck disable=SC2016
          # $1 in single-quoted sh -c body is intentional (inner shell expands it).
          mapfile -t files < <(
            find . -type f \
              \( -name '*.py' -o -path '*/bin/executable_*' -o -path '*/hooks/executable_*' \) \
              -not -path './.git/*' \
              -not -path './.ruff_cache/*' \
              -print0 | xargs -0 -I{} sh -c 'head -1 "$1" | grep -qE "python" && echo "$1"' _ {}
          )
          [ ${#files[@]} -eq 0 ] && { echo "no python files"; exit 0; }
          printf '%s\n' "${files[@]}"
          uvx ruff check "${files[@]}"
          uvx ruff format --check "${files[@]}"
