name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted toggle: set vars.RUNS_ON to 'self-hosted' to route to local runners.
#   gh variable set RUNS_ON --body 'self-hosted' -R jasonluther/dotfiles-jl-public
#   gh variable set RUNS_ON --body 'ubuntu-latest' -R jasonluther/dotfiles-jl-public  # revert

jobs:
  lint:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Cache pre-commit envs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: |
          uv tool install pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure zsh is available
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends zsh
          fi

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install trufflehog
        run: |
          install -d "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: pre-commit
        env:
          SKIP: trailing-whitespace,end-of-file-fixer,check-yaml,check-json,check-toml,check-merge-conflict,detect-private-key,trufflehog
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      - name: ruff (shebang Python scripts only)
        run: |
          # shellcheck disable=SC2016
          mapfile -t files < <(
            find . -type f \
              \( -path '*/bin/executable_*' -o -path '*/hooks/executable_*' \) \
              -not -name '*.py' \
              -not -path './.git/*' \
              -not -path './.ruff_cache/*' \
              -print0 | xargs -0 -I{} sh -c 'head -1 "$1" | grep -qE "python" && echo "$1"' _ {}
          )
          [ ${#files[@]} -eq 0 ] && { echo "no shebang python scripts"; exit 0; }
          printf '%s\n' "${files[@]}"
          uvx ruff check "${files[@]}"
          uvx ruff format --check "${files[@]}"

      - name: chezmoi template syntax
        env:
          CHEZMOI_NAME: ci
          CHEZMOI_EMAIL: ci@example.com
        run: |
          chezmoi init --source="$GITHUB_WORKSPACE"
          shopt -s nullglob
          files=(.chezmoiscripts/*.tmpl)
          [ ${#files[@]} -eq 0 ] && { echo "no .chezmoiscripts templates"; exit 0; }
          fail=0
          for f in "${files[@]}"; do
            echo "==> $f"
            if ! chezmoi execute-template <"$f" | bash -n /dev/stdin; then
              echo "FAIL: $f"
              fail=1
            fi
          done
          exit "$fail"

      - name: zsh -n (parser-only)
        run: |
          shopt -s nullglob
          files=(dot_zshrc dot_zprofile dot_config/shell/*.sh)
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            echo "==> $f"
            zsh -n "$f"
          done

      - name: trufflehog (full history)
        run: trufflehog git --no-update --results=verified,unverified --fail file://.
