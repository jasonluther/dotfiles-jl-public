# Forward mouse events (scroll wheel, click-to-select pane) to tmux.
# Lets the Mac trackpad scroll the active pane's scrollback over SSH.
set -g mouse on

# Pass through 24-bit colour and italics from terminals that support them.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"

# Larger scrollback buffer.
set -g history-limit 50000
